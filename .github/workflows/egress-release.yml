name: Egress Release
run-name: Egress package · ${{ inputs.version_tag || inputs.egress_ref || 'default branch' }}

on:
  workflow_dispatch:
    inputs:
      egress_repository:
        description: one-browser-egress repository
        required: false
        default: voiceofhu/one-browser-egress
      egress_ref:
        description: one-browser-egress branch, tag, or commit. Empty means the default branch.
        required: false
      version_tag:
        description: Optional version guard. Empty reads Cargo.toml from the resolved commit.
        required: false

permissions:
  contents: write

concurrency:
  group: egress-release-${{ inputs.version_tag || inputs.egress_ref || 'default' }}
  cancel-in-progress: false

env:
  CI: true
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RELEASE_REPOSITORY: voiceofhu/one-browser-action

jobs:
  resolve:
    name: Resolve Egress package
    runs-on: ubuntu-latest
    outputs:
      egress_repository: ${{ steps.source.outputs.egress_repository }}
      egress_sha: ${{ steps.source.outputs.egress_sha }}
      package_version: ${{ steps.source.outputs.package_version }}
      release_tag: ${{ steps.source.outputs.release_tag }}

    steps:
      - name: Checkout packaging action
        uses: actions/checkout@v4
        with:
          path: action
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Validate public Egress installer
        working-directory: action
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n install.sh uninstall.sh \
            scripts/egress/install/*.sh scripts/egress/uninstall/*.sh \
            tests/egress-install_test.sh tests/egress-uninstall_test.sh
          bash tests/egress-install_test.sh
          bash tests/egress-uninstall_test.sh

      - name: Resolve immutable Egress source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EGRESS_REPOSITORY_INPUT: ${{ inputs.egress_repository }}
          EGRESS_REF_INPUT: ${{ inputs.egress_ref }}
          VERSION_TAG_INPUT: ${{ inputs.version_tag }}
        run: bash action/.github/scripts/resolve-egress-package.sh

  build:
    name: Package Linux ${{ matrix.arch }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl

    steps:
      - name: Checkout Egress
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.egress_repository }}
          ref: ${{ needs.resolve.outputs.egress_sha }}
          path: egress
          token: ${{ secrets.GH_TOKEN }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install static Linux toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      - name: Build static Egress binary
        working-directory: egress
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: cargo build --release --locked --target "$RUST_TARGET"

      - name: Prepare binary asset
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -Eeuo pipefail
          install -d release-assets
          install -m 0755 \
            "egress/target/$RUST_TARGET/release/one-browser-egress" \
            "release-assets/one-browser-egress-linux-$ARCH"
          file "release-assets/one-browser-egress-linux-$ARCH" |
            grep -q 'static' || {
              echo "Native Egress asset is not statically linked." >&2
              exit 1
            }

      - name: Upload binary asset
        uses: actions/upload-artifact@v4
        with:
          name: egress-linux-${{ matrix.arch }}
          path: release-assets/one-browser-egress-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish Egress package
    needs:
      - resolve
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public Egress installer
        uses: actions/checkout@v4
        with:
          path: action
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Download binary assets
        uses: actions/download-artifact@v4
        with:
          pattern: egress-linux-*
          path: dist
          merge-multiple: true

      - name: Assemble checksummed package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.resolve.outputs.package_version }}
        run: |
          set -Eeuo pipefail
          (
            cd dist
            sha256sum \
              one-browser-egress-linux-amd64 \
              one-browser-egress-linux-arm64 \
              >SHA256SUMS
          )
          bundle="one-browser-egress-$PACKAGE_VERSION.tar.gz"
          tar -C dist -czf "dist/$bundle" \
            one-browser-egress-linux-amd64 \
            one-browser-egress-linux-arm64 \
            SHA256SUMS
          (
            cd dist
            sha256sum "$bundle" >>SHA256SUMS
          )

      - name: Upload complete Egress package to this Action run
        uses: actions/upload-artifact@v4
        with:
          name: one-browser-egress-${{ needs.resolve.outputs.package_version }}
          path: dist
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable Action release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          PACKAGE_VERSION: ${{ needs.resolve.outputs.package_version }}
          EGRESS_REPOSITORY: ${{ needs.resolve.outputs.egress_repository }}
          EGRESS_SHA: ${{ needs.resolve.outputs.egress_sha }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "$RELEASE_REPOSITORY" || {
            echo "Egress packages may only be published by $RELEASE_REPOSITORY." >&2
            exit 1
          }
          release_body="$(
            printf 'Egress source: %s@%s' \
              "$EGRESS_REPOSITORY" "$EGRESS_SHA"
          )"
          if existing_release="$(gh release view "$RELEASE_TAG" \
            --repo "$RELEASE_REPOSITORY" \
            --json body,assets 2>/dev/null)"; then
            existing_source="$(jq -r '.body // "" | split("\n")[0]' <<<"$existing_release")"
            test "$existing_source" = "$release_body" || {
              echo "Release $RELEASE_TAG belongs to a different Egress source." >&2
              exit 1
            }
            for asset in one-browser-egress-linux-amd64 \
              one-browser-egress-linux-arm64 \
              "one-browser-egress-$PACKAGE_VERSION.tar.gz" SHA256SUMS; do
              jq -e --arg asset "$asset" \
                '.assets | any(.[]; .name == $asset)' \
                <<<"$existing_release" >/dev/null || {
                  echo "Release $RELEASE_TAG is incomplete; refusing to mutate it." >&2
                  exit 1
                }
            done
            echo "Immutable Egress release $RELEASE_TAG already exists."
            exit 0
          fi

          gh release create "$RELEASE_TAG" dist/* \
            --repo "$RELEASE_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "One Browser Egress $RELEASE_TAG" \
            --notes "$release_body"
